services:
  - type: web
    name: bogi-property-api
    runtime: python
    region: singapore          # closest to India
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://bogi-property-app.web.app,https://bogi-property-app.firebaseapp.com
      - key: ANTHROPIC_API_KEY
        sync: false            # set manually in Render dashboard
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: sendgrid
      - key: SMS_PROVIDER
        value: msg91
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        value: noreply@bogineni.com
      - key: SENDGRID_FROM_NAME
        value: Bogineni Group
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_SENDER_ID
        value: BOGINI
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
